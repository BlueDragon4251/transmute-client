name: Client-only validation
on:
  push:
    branches: [agent/client-only-conversion]
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/client_only_boundary.py'
      - 'backend/tests/test_client_only_boundary.py'
      - '.github/workflows/client-only.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=backend python -m pytest --noconftest -q backend/tests/test_client_only_boundary.py
