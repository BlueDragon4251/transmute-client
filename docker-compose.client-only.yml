# Build this fork; never deploy the upstream ghcr.io/transmute-app/transmute image.
services:
  transmute-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client-only
    restart: unless-stopped
    ports:
      - "127.0.0.1:3313:3313"
    environment:
      ALLOW_UNAUTHENTICATED: "false"
      ORT_DISABLE_TELEMETRY: "1"
    volumes:
      - transmute_client_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3313/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  transmute_client_data:
